[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchless"
version = "0.1.0"
description = "Turn videos (YouTube links or files) into clean, timestamped text for people and AI agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["yt-dlp[default]>=2026.8.19", "faster-whisper>=1.1", "numpy"]

[project.optional-dependencies]
proxy = ["pproxy>=2.7"]
dev = ["pytest"]

[project.scripts]
watchless = "watchless.cli:main"

[tool.setuptools]
packages = ["watchless"]
